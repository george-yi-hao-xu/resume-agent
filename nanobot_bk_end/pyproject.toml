[project]
name = "resume-nanobot-bk"
version = "0.1.0"
description = "Resume diff backend powered by HKUDS nanobot (Python)"
requires-python = ">=3.11"
dependencies = [
    "nanobot-ai",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pyright>=1.1.380",
    "ruff>=0.7.0",
]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
strict = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
